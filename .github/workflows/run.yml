name: Update xiaosa

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - ".github/workflows/run.yml"

# 不写这段，默认 GITHUB_TOKEN 只有只读权限，git push 会 403
permissions:
  contents: write

concurrency:
  group: update-xiaosa
  cancel-in-progress: false

jobs:
  xiaosa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install deps
        run: python3 -m pip install --break-system-packages demjson3 pycryptodome requests

      # ---------------- 源二：wmz（"YmFzZTY0**" + base64(JSON) 格式） -> wmz/ ----------------
      # 故意放在 sun.json 之前跑：build_local.py 下载 spider 失败时会去 ../jar/spider.jar 兜底，
      # 先跑 wmz 时 jar/ 里还没有别的 jar，不会把 xiaosa 的 jar 误当成 wmz 的。
      - name: Decrypt wmz and build wmz files
        working-directory: tools
        run: |
          set -e
          curl -fsSL --retry 3 --retry-delay 2 "https://8815.kstore.vip/tvbox/wmz" -o wmz.enc
          python3 - <<'PY'
          import base64, json, re

          raw = open("wmz.enc", "rb").read().decode("utf-8", "ignore").strip()
          # 这个接口不是 tvbox 的 hex 格式，而是 "YmFzZTY0**" + base64(JSON)，tvbox.py 解不了
          body = re.sub(r"^[A-Za-z0-9+/=]+\*\*", "", raw)
          data = json.loads(base64.b64decode(body + "=" * (-len(body) % 4)))
          with open("wmz.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print("✓ wmz 解码完成, sites =", len(data.get("sites", [])))
          PY
          if [ ! -s wmz.json ]; then
            echo "::error::wmz 解码失败，wmz.json 没有生成"
            exit 1
          fi
          python3 build_local.py wmz.json output_wmz
          # 把下载到的 spider.jar 改名成 wmz.jar，并同步改写 api.json 的 spider 字段（md5 不变）
          python3 - <<'PY'
          import os, re

          src, dst, api = "output_wmz/spider.jar", "output_wmz/wmz.jar", "output_wmz/api.json"
          if os.path.exists(src) and os.path.exists(api):
              os.replace(src, dst)
              with open(api, encoding="utf-8") as f:
                  text = f.read()
              new, n = re.subn(r'("spider"\s*:\s*")(?:\./)?spider\.jar', r'\1./wmz.jar', text, count=1)
              if n:
                  with open(api, "w", encoding="utf-8") as f:
                      f.write(new)
                  print("✓ spider.jar 已改名为 wmz.jar，api.json 的 spider 已同步为 ./wmz.jar")
              else:
                  print("::warning::api.json 里没找到 ./spider.jar，spider 字段未改写")
          else:
              print("::warning::没有下载到 spider.jar（spider 仍指向远程地址），跳过改名")
          PY
          mkdir -p ../wmz
          cp -a output_wmz/. ../wmz/
          # 旧版本用的是 wmz/spider.jar，改名后要清掉，避免仓库里两份 jar 并存
          rm -f ../wmz/spider.jar
          rm -rf output_wmz wmz.json wmz.enc

      # ---------------- 源一：sun.json（tvbox 的 hex 加密格式） -> xiaosa/ + jar/ ----------------
      - name: Decrypt sun.json and build xiaosa files
        working-directory: tools
        run: |
          set -e
          python3 tvbox.py https://9877.kstore.space/sun.json xs.json dec
          # tvbox.py 解密失败时也是退出码 0，必须自己检查产物
          if [ ! -s xs.json ]; then
            echo "::error::解密失败，xs.json 没有生成"
            exit 1
          fi
          python3 build_local.py xs.json output
          mkdir -p ../xiaosa
          cp -a output/. ../xiaosa/
          python3 copy_xbpq.py ./output/api.json
          mkdir -p ../jar
          cp -a ./output/spider.jar ../jar/spider.jar
          rm -rf output xs.json

      - name: Upload artifacts
        # 上一步失败时也要把已经生成的东西传上去
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xiaosa-output
          if-no-files-found: warn
          path: |
            jar/
            xiaosa/
            wmz/
            json/
            py/
            js/

      - name: Commit and push
        if: always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "没有文件更新，不执行 git push"
            exit 0
          fi
          git commit -m "更新源 $(date +%Y%m%d%H%M)"
          # 仓库默认分支是 main，原来写 origin master 会报
          # "src refspec master does not match any"
          git push origin HEAD:main
